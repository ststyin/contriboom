<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contriboom · Make your contributions a blast.</title>
  <style>
    :root { color-scheme:light; --bg:#f4f3ec; --text:#25382f; --muted:#617368; --line:#d5dbce; --surface:#fcfbf6; --accent:#b65a15; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    body.dark { color-scheme:dark; --bg:#0a0e13; --text:#edf1f4; --muted:#92a1b2; --line:#27313d; --surface:#141b23; --accent:#ffae57; }
    main { max-width:1410px; margin:auto; padding:48px 36px 32px; }
    nav { display:flex; align-items:center; justify-content:space-between; padding-bottom:24px; border-bottom:1px solid var(--line); }
    .brand { font-size:18px; font-weight:750; letter-spacing:-.5px; }
    .brand span { color:var(--accent); }
    header { margin:42px 0 28px; }
    h1 { font-size:clamp(29px,4vw,51px); line-height:1.15; letter-spacing:-2px; margin:14px 0; font-weight:730; }
    object { display:block; width:100%; height:auto; aspect-ratio:1294/452; border-radius:24px; overflow:hidden; }
    .controls { display:flex; align-items:center; flex-wrap:wrap; gap:12px; padding:20px 0; }
    button,a.download { background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 16px; font:600 12px system-ui; cursor:pointer; text-decoration:none; }
    button:hover,a.download:hover { border-color:var(--accent); }
    button:focus-visible,a:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .seek { display:flex; align-items:center; gap:12px; flex:1; min-width:220px; }
    input { flex:1; min-width:70px; accent-color:var(--accent); cursor:pointer; }
    output { font:11px ui-monospace,Consolas,monospace; color:var(--muted); min-width:92px; text-align:right; }
    #notice { color:var(--accent); font-size:13px; }
    @media(max-width:650px) { main {padding:24px 16px;} header {margin:30px 0 20px;} h1 {letter-spacing:-1px;} .seek {flex-basis:100%;} }
  </style>
</head>
<body>
<main>
  <nav><div class="brand">Contriboom<span>.</span></div></nav>
  <header>
    <h1>Make your contributions a blast.</h1>
  </header>
  <object id="arena" type="image/svg+xml" data="artifacts/game.svg" aria-label="Contriboom contribution arena">Your browser cannot display this animation.</object>
  <p id="notice" hidden></p>
  <div class="controls">
    <button id="play" type="button">Pause</button>
    <button id="restart" type="button">Restart</button>
    <button id="theme" type="button" aria-pressed="false">Dark theme</button>
    <div class="seek"><input id="seek" type="range" min="0" max="22" step="0.01" value="0" aria-label="Animation time"><output id="time">0.0s / 22.0s</output></div>
    <a id="download" class="download" href="artifacts/game.svg" download="contriboom.svg">Download SVG ↗</a>
  </div>
</main>
<script>
  const arena = document.getElementById('arena');
  const play = document.getElementById('play');
  const seek = document.getElementById('seek');
  const theme = document.getElementById('theme');
  const time = document.getElementById('time');
  let duration = 22, paused = false, dark = false, svg;
  const formatTime = seconds => seconds >= 60 ? `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}` : `${seconds.toFixed(1)}s`;
  arena.addEventListener('load', () => {
    try {
      svg = arena.contentDocument.documentElement;
      duration = parseFloat(svg.querySelector('animate,animateTransform').getAttribute('dur'));
      seek.max = duration;
      seek.value = 0;
      paused = false;
      play.textContent = 'Pause';
    } catch {
      document.getElementById('notice').hidden = false;
      document.getElementById('notice').textContent = 'Playback controls are unavailable. You can still download the animation.';
    }
  });
  play.addEventListener('click', () => {
    if (!svg?.pauseAnimations) return;
    paused = !paused;
    paused ? svg.pauseAnimations() : svg.unpauseAnimations();
    play.textContent = paused ? 'Play' : 'Pause';
  });
  document.getElementById('restart').addEventListener('click', () => {
    if (!svg?.setCurrentTime) return;
    svg.setCurrentTime(0); svg.unpauseAnimations(); paused = false; play.textContent = 'Pause';
  });
  seek.addEventListener('input', () => {
    if (!svg?.setCurrentTime) return;
    svg.pauseAnimations(); paused = true; play.textContent = 'Play'; svg.setCurrentTime(Number(seek.value));
  });
  theme.addEventListener('click', () => {
    dark = !dark;
    document.body.classList.toggle('dark', dark);
    theme.textContent = dark ? 'Light theme' : 'Dark theme';
    theme.setAttribute('aria-pressed', String(dark));
    svg = undefined;
    arena.data = dark ? 'artifacts/game-dark.svg' : 'artifacts/game.svg';
    document.getElementById('download').href = arena.data;
  });
  function tick() {
    if (svg?.getCurrentTime) {
      const current = svg.getCurrentTime() % duration;
      if (!paused) seek.value = current;
      time.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
