# Copy this file to .github/workflows/contriboom.yml in your profile repository.
# Examples use the `v1.0.0` release tag.
# Use @main to follow the latest development changes.
name: Update contribution animation

on:
  schedule:
    # Daily at 00:23 UTC (08:23 Asia/Shanghai).
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contriboom-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate contribution arena
        id: contriboom
        uses: ststyin/contriboom@v1.0.0
        with:
          # Omitted inputs use their defaults. Uncomment a setting and edit its value to enable it.

          # ===== Data source =====
          # username: GitHub username. Default: the current repository owner.
          username: ${{ github.repository_owner }}
          # github-token: GitHub access token. Default: ${{ github.token }} (the workflow token).
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # year: 2008 through the current year. Default: empty (the past 365 days, including today).
          # Past years cover the full calendar year; the current year covers January 1 through today.
          # year: '2025'

          # ===== Output location =====
          # output-dir: Subdirectory inside the repository workspace. Default: artifacts.
          # This example writes to images/contriboom.
          output-dir: images/contriboom

          # ===== Playback mode =====
          # mode: clear | preview. Default: clear.
          # clear: Requires a safe full clear, with no bomb count cap.
          # preview: Limits the number of bombs; some blocks may remain uncleared.
          # mode: clear

          # This optional limit applies only to preview; fewer bombs may be placed.
          # max-bombs: Integer from 0 to 20. Default: 5 bombs.
          # max-bombs: '5'

          # ===== Explosion rules =====
          # block-damage: fade | instant. Default: fade.
          # fade: Lowers a block's level on each hit until it disappears; instant: Destroys it in one hit.
          # block-damage: fade

          # range-mode: fixed | previous-day | previous-week | previous-month. Default: fixed.
          # fixed: Uses a fixed range. Other modes use the prior 1 / 7 / 30 days' daily average, rounded up.
          # range-mode: fixed
          # range: Integer from 1 to 10 cells. Default: 4. Fixed range in fixed mode; cap in other modes.
          # range: '4'

          # ===== Appearance =====
          # theme: Default: github. Choices:
          # github, light, dark, ocean, sakura, cyberpunk, sunset, nord,
          # mocha, mint, sky, lavender, peach, sand, rose.
          # theme: github

          # player-icon: Image path inside the repository. Default: empty (the built-in robot).
          # Supports PNG / JPEG / GIF / WebP / SVG, up to 2 MiB.
          # player-icon: assets/bomber.png
          # player-icon-trim: auto | none. Default: auto. Applies only to custom player images.
          # auto: Trims transparent or near-white margins; none: Preserves the entire canvas.
          # player-icon-trim: auto

          # ===== Randomness =====
          # seed: A safe integer. Default: 42. Identical data, settings, and seed produce the same replay.
          # seed: '66'

      - name: Commit updated images
        shell: bash
        env:
          SVG: ${{ steps.contriboom.outputs.svg }}
          SVG_STATIC: ${{ steps.contriboom.outputs.svg-static }}
        run: |
          git add -f -- "$SVG" "$SVG_STATIC"
          if git diff --cached --quiet; then
            echo "Contribution images are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update contribution animation"
          git push
