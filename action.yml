name: Contriboom
description: Turn a GitHub contribution calendar into an animated SVG arena.
author: ststyin
branding:
  icon: zap
  color: orange

inputs:
  username:
    description: GitHub account whose contributions to animate.
    required: true
    default: ${{ github.repository_owner }}
  github-token:
    description: Token used to read contributions. Defaults to the workflow token.
    default: ${{ github.token }}
  year:
    description: Calendar year. Leave empty for the past year.
  output-dir:
    description: Destination directory inside the caller's workspace.
    default: artifacts
  mode:
    description: clear requires a safe full clear; preview limits the number of bombs.
    default: clear
  theme:
    description: Tile palette for game.svg and game-static.svg (github, light, dark, ocean, sakura, cyberpunk, sunset, nord, mocha, mint, sky, lavender, peach, sand, rose).
    default: github
  player-icon:
    description: Image path inside the caller repository (PNG, JPEG, GIF, WebP, or SVG, up to 2 MiB). Leave empty for the default robot.
  player-icon-trim:
    description: auto fits the character after trimming transparent or near-white margins; none preserves the entire image canvas.
    default: auto
  seed:
    description: Seed for reproducible simulations.
    default: '42'
  range:
    description: Explosion range in cells (1–10). Fixed value in fixed mode; maximum range in adaptive modes.
    default: '4'
  range-mode:
    description: fixed, previous-day, previous-week (7-day daily average), or previous-month (30-day daily average). Adaptive values are rounded up and capped by range.
    default: fixed
  block-damage:
    description: instant destroys a block on one hit; fade lowers its activity level by one per hit until it disappears.
    default: fade
  max-bombs:
    description: Maximum bombs in preview mode (0–20).
    default: '5'

outputs:
  output-dir:
    description: Absolute path to the generated directory.
    value: ${{ steps.generate.outputs.output-dir }}
  svg:
    description: Absolute path to the animation using the selected tile palette.
    value: ${{ steps.generate.outputs.svg }}
  svg-static:
    description: Absolute path to the static image using the selected tile palette.
    value: ${{ steps.generate.outputs.svg-static }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Install image processing dependency
      if: ${{ inputs.player-icon != '' && inputs.player-icon-trim != 'none' }}
      shell: bash
      env:
        CONTRIBOOM_ACTION_PATH: ${{ github.action_path }}
      run: npm ci --omit=dev --include=optional --ignore-scripts --prefix "$CONTRIBOOM_ACTION_PATH"
    - name: Generate contribution arena
      id: generate
      shell: bash
      env:
        CONTRIBOOM_ACTION_PATH: ${{ github.action_path }}
        CONTRIBOOM_INPUT_USERNAME: ${{ inputs.username }}
        CONTRIBOOM_INPUT_TOKEN: ${{ inputs.github-token }}
        CONTRIBOOM_INPUT_YEAR: ${{ inputs.year }}
        CONTRIBOOM_INPUT_OUTPUT: ${{ inputs.output-dir }}
        CONTRIBOOM_INPUT_MODE: ${{ inputs.mode }}
        CONTRIBOOM_INPUT_THEME: ${{ inputs.theme }}
        CONTRIBOOM_INPUT_PLAYER_ICON: ${{ inputs.player-icon }}
        CONTRIBOOM_INPUT_PLAYER_ICON_TRIM: ${{ inputs.player-icon-trim }}
        CONTRIBOOM_INPUT_SEED: ${{ inputs.seed }}
        CONTRIBOOM_INPUT_RANGE: ${{ inputs.range }}
        CONTRIBOOM_INPUT_RANGE_MODE: ${{ inputs.range-mode }}
        CONTRIBOOM_INPUT_BLOCK_DAMAGE: ${{ inputs.block-damage }}
        CONTRIBOOM_INPUT_MAX_BOMBS: ${{ inputs.max-bombs }}
      run: node "$CONTRIBOOM_ACTION_PATH/scripts/action.ts"
